        <br>

            <option value="1">c</option>
        </select>

        <br>
        <label for="option">do you want to sing?

        <input type="radio" name="option" value="">
        Yes
        <br>
        <input type="radio" name="option" value="">

        <br>
        <input type="radio" name="option" value="">
        Yes
        <br>
        </label>
        <br>

        <br>

    </div>
